# nginx config for the built app.
#
# Two jobs, and the second is the one people get wrong:

#   1. Serve the static files.
#   2. Serve index.html for everything that is not a file.

# (2) is not optional. The app uses client-side routing, so a hard refresh on
# /pipeline produces a request for a path that does not exist on disk. Without
# this, nginx answers 404 and the user sees a browser error page — the app never
# loads at all. It is the single most common way a deployed SPA breaks.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Security headers.
    #
    # The CSP is deliberately not 'unsafe-inline' for scripts: Vite emits no
    # inline script, so it does not need it. Styles are the exception — Tailwind
    # and any inline style attribute need it, hence the separate style-src.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite writes content-hashed filenames into dist/assets, so those can be
    # cached indefinitely: a changed file has a changed name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached. It is the file that points at the current
    # hashed assets, so a stale copy pins the browser to a previous release —
    # which reads as "my fix deployed and nothing changed".
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The container has nothing to hide and no shell to escape into, but nginx's
    # own dotfile rules are cheap.
    location ~ /\. {
        deny all;
    }

    # A request for a missing asset is a real 404. Serving index.html for it
    # would hand the browser an HTML document where it expects JavaScript, and
    # the resulting error message points at nothing useful.
    location ~* \.(js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }
}
