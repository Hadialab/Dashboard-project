name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push supersedes an in-flight run for the same ref. Without this, every
# push queues another full run and the badge sits on a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22.22.2 or newer.
  #
  # This was Node 20 for a long time, and it was wrong. jsdom 30 declares
  # `engines: ^22.22.2 || ^24.15.0 || >=26.0.0` and does not support Node 20 at
  # all. npm installs it anyway — `engines` is advisory unless the package sets
  # engine-strict — so the build installed cleanly and then failed at runtime with
  #
  #   TypeError: webidl.util.markAsUncloneable is not a function
  #     at new CacheStorage (undici/lib/web/cache/cachestorage.js)
  #     at node_modules/jsdom/lib/api.js
  #
  # once per test file, reported by Vitest as an unhandled error rather than a
  # failing test. So the build went red with no test named and nothing pointing at
  # the runtime.
  #
  # 24 is what this is developed on, so CI matching it also means a test that
  # passes here passes there. The floor assertion below is what stops this
  # regressing the next time someone reads "engines is only advisory" and drops
  # the version back.
  NODE_VERSION: "22.22"

jobs:
  # Fast feedback: lint, unit and integration tests, and a production build.
  # No database needed, because every test in this job mocks the service layer.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # Both lockfiles, so a frontend-only change does not re-resolve the
          # backend's and vice versa.
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Fails loudly, here, with the package that objected.
      #
      # The alternative is what happened for weeks: `npm ci` happily installs a
      # dependency that declares it does not support the runtime, and the failure
      # surfaces 200 lines into a Vitest log as an unhandled error in a file nobody
      # changed. Checking `engines` up front costs one step and names the culprit.
      - name: Check every dependency supports this Node
        working-directory: frontend
        run: |
          echo "node $(node --version)"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { createRequire } from 'node:module';
            const require = createRequire(process.cwd() + '/');

            // A deliberately conservative semver range test. It handles the caret,
            // tilde and comparison forms these packages actually use, and treats
            // anything it cannot parse as "check it by hand" rather than silently
            // passing.
            //
            // The optional whitespace after the operator is load-bearing: pg
            // declares ">= 16.0.0", and without \s* the regex reads that as a bare
            // "16.0.0" and tests for exact equality — which reports every Node as
            // unsupported. A guard that cries wolf gets disabled, which is worse
            // than not having one.
            const satisfies = (range, version) => {
              const [maj, min] = version.split('.').map(Number);
              const ok = (test) => { try { return test(); } catch { return true; } };

              return range.split('||').some((part) => part.trim().split(/\s+/).every((clause) => {
                const m = clause.match(/^(\^|~|>=|<=|>|<|=)?\s*v?(\d+)(?:\.(\d+))?/);
                if (!m) return true; // Unparsed: do not block, but do not claim it passed.
                const op = m[1] ?? '=';
                const a = [Number(m[2]), Number(m[3] ?? 0)];
                const b = [maj, min];
                return ok(() => {
                  if (op === '^' || op === '~') return a[0] === b[0] && b[1] >= a[1];
                  if (op === '>=') return b[0] > a[0] || (b[0] === a[0] && b[1] >= a[1]);
                  if (op === '<=') return b[0] < a[0] || (b[0] === a[0] && b[1] <= a[1]);
                  if (op === '>') return b[0] > a[0] || (b[0] === a[0] && b[1] > a[1]);
                  if (op === '<') return b[0] < a[0];
                  return b[0] === a[0] && b[1] === a[1];
                });
              }));
            };

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const names = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies });
            const bad = [];

            for (const name of names) {
              let manifest;
              try {
                manifest = require(name + '/package.json');
              } catch {
                continue; // Not resolvable at the top level; skip rather than guess.
              }
              const range = manifest.engines?.node;
              if (range && !satisfies(range, process.versions.node)) {
                bad.push(name + '@' + manifest.version + ' requires ' + range);
              }
            }

            if (bad.length) {
              console.error('These dependencies do not support Node ' + process.versions.node + ':');
              for (const b of bad) console.error('  - ' + b);
              console.error('');
              console.error('Raise NODE_VERSION in ci.yml, or pin those packages to a version that supports this runtime.');
              process.exit(1);
            }
            console.log('All ' + names.length + ' direct dependencies declare support for this Node.');
          "

      - name: Lint
        working-directory: frontend
        # oxlint exits non-zero on errors. Warnings are reported and do not fail
        # the build, so a new warning cannot block a merge on its own.
        run: npm run lint

      # Three typechecks, because none alone is worth much.
      #
      # `typecheck` uses the shipped tsconfig, where noImplicitAny is off so that
      # untyped JavaScript still compiles. That means it passes on a component whose
      # props are entirely untyped — it catches type *mismatches* but not missing
      # types. `typecheck:strict` turns that flag on and is the only thing that
      # catches a prop or callback parameter left implicit.
      #
      # `typecheck:tests` is a separate config because tsconfig.json *excludes*
      # `src/test` outright. That exclusion hid 28 real errors across three test
      # files that were already written in TypeScript and already looked correct.
      # A test suite that is excluded from the type checker is a suite whose types
      # are decoration.
      #
      # All three are run so none can rot. A green build here has previously been a
      # false signal for exactly this reason.
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck && npm run typecheck:strict && npm run typecheck:tests

      # Vitest's default pool is `forks`, and every test file needs a worker
      # process spawned for it. GitHub's runners give the container 64MB of
      # /dev/shm, which is the usual cause of "Failed to start forks worker".
      #
      # This was *not* the cause here — remounting it changed nothing — but it is
      # cheap, correct, and the kind of limit a runner can tighten without warning,
      # so it stays. 1GB is generous but free: /dev/shm is tmpfs, so it is
      # RAM-backed and untouched pages are never resident.
      - name: Raise the shared memory limit
        run: sudo mount -o remount,size=1G /dev/shm

      # The API's own tests. Separate from the frontend's because they are a
      # different process with different assumptions, and because the frontend's
      # coverage gate is scoped to its own layers — folding these in would dilute
      # it. They need no database: everything tested here is pure logic.
      - name: API tests
        working-directory: backend
        run: npm ci && npm test

      - name: Unit and integration tests
        working-directory: frontend
        # Vitest is told to use its github-actions reporter so a failing test is
        # an annotation on the test file, visible on the CI page rather than only
        # in the raw log.
        #
        # On top of that, a failure that is *not* a test failure — a worker that
        # never started, an unhandled rejection after the last test — produces no
        # annotations at all and would otherwise be completely opaque. That is not
        # hypothetical: it is exactly how a broken Node version presented here, as
        # a bare "exit code 1" that named no test and pointed at nothing. So the
        # log tail is re-emitted as one annotation, which is the only way to see a
        # failure that the reporter has nothing to report about.
        #
        # `set +e` because GitHub runs a `run:` block under `bash -e`, which would
        # end the block at the failing command before anything was reported.
        #
        # Note the reporter name: `github-actions`, not `github`. `github` is what
        # Playwright's is called, and guessing by analogy fails with "Failed to
        # load custom Reporter from github".
        run: |
          set +e
          npm run test -- --reporter=github-actions > test-output.log 2>&1
          code=$?

          if [ "$code" -ne 0 ]; then
            # Newlines become `+` and `%` becomes `%25`, because a workflow
            # command is a single line and `%` starts an escape. The tail rather
            # than the head, because this failure mode prints its cause at the end.
            detail=$(sed -e 's/\x1b\[[0-9;]*m//g' test-output.log | tail -c 6000 | tr '\n' '+' | sed 's/%/%25/g')
            echo "::error title=Test run failed::${detail}"
          fi

          exit "$code"

      - name: Coverage
        working-directory: frontend
        # Fails the job if coverage of services/utils/store/hooks drops below the
        # thresholds set in vite.config.js, so the gate cannot be quietly removed.
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        env:
          # A stand-in URL, because this job checks that the bundle compiles and
          # never runs it. The real value is a deploy secret; see deploy.yml.
          VITE_API_URL: https://api.ci.invalid
        run: npm run build

      - name: Staging build
        working-directory: frontend
        env:
          # A separate mode, so the staging build path is exercised on every push
          # rather than first discovered when someone needs it.
          VITE_API_URL: https://api.staging.ci.invalid
        run: npm run build:staging

      - name: Reject a publish build with a placeholder API URL
        working-directory: frontend
        env:
          # No VITE_API_URL, so it falls back to the placeholder in .env.production.
          VITE_DEPLOY: "1"
        run: |
          # Inverted on purpose. This step is only useful if the build FAILS, so
          # it asserts failure rather than asserting success. A guard that is
          # never tested is a guard that quietly stops guarding — which is exactly
          # how the original version of this check ended up in the browser bundle,
          # where nothing could ever trip it.
          if npm run build; then
            echo "::error::A publish build with a placeholder API URL succeeded. The config guard is not working."
            exit 1
          fi
          echo "Guard held: the build was refused."

      - name: Upload the built app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # The full stack, in a real database, with a real browser. Separate from the
  # job above so a Playwright flake does not read as a broken unit test.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway secret. The suite creates its own accounts, and nothing here
      # is reachable once the job ends.
      JWT_SECRET: ci-e2e-secret-not-used-anywhere-real
      # Playwright's webServer block overrides PORT and CORS_ORIGIN for the API it
      # starts, and the API applies the schema on boot, so there is nothing else
      # to configure. This database is the one it will be pointed at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_e2e
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        # Vitest is a devDependency, and this job runs before the build, so it
        # needs the full tree. `npm ci` rather than --omit=dev on purpose.
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # Only Chromium. The suite is written against it, and pulling three
        # engines for one project roughly triples the cache for no extra signal.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          # CI has no preinstalled Chrome, so use the pinned Playwright build.
          E2E_BROWSER: chromium
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
