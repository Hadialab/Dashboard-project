name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push supersedes an in-flight run for the same ref. Without this, every
# push queues another full run and the badge sits on a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a minor, not "20".
  #
  # vite 8 requires ^20.19.0 || >=22.12.0, and jsdom, oxlint and @sentry/react
  # all have their own floors. Asking for "20" resolves to whatever 20.x
  # setup-node downloads, so the runner can land on a version the toolchain does
  # not support and fail with a syntax or engine error that reads like a bug in
  # the tests. Pinning to a minor makes that impossible, and the assertion below
  # turns a silent drift into a message that says which package objected.
  NODE_VERSION: "20.19"

jobs:
  # Fast feedback: lint, unit and integration tests, and a production build.
  # No database needed, because every test in this job mocks the service layer.
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Fails loudly on an unsupported Node instead of letting the first test that
      # touches a newer syntax API die with a message that points at the test
      # rather than at the runtime.
      - name: Check the Node version is supported
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "node $(node --version)"
          node -e "
            const required = ['vite', 'vitest', 'jsdom'];
            const [major, minor] = process.versions.node.split('.').map(Number);
            // vite is the strictest: ^20.19.0 || >=22.12.0
            const ok = major > 22 || (major === 22 && minor >= 12) || (major === 20 && minor >= 19);
            if (!ok) {
              console.error('Node ' + process.versions.node + ' is below the toolchain floor (20.19).');
              process.exit(1);
            }
            console.log('Supported by ' + required.join(', ') + '.');
          "

      - name: Lint
        working-directory: frontend
        # oxlint exits non-zero on errors. Warnings are reported and do not fail
        # the build, so a new warning cannot block a merge on its own.
        run: npm run lint

      - name: Unit and integration tests
        working-directory: frontend
        # The reporter's job here is to put the failure somewhere a human will
        # actually see.
        #
        # `github-actions` turns each failed test into an annotation on its file,
        # so the CI page names the test rather than just saying "exit code 1". The
        # name is not `github` — that is Playwright's, and guessing by analogy
        # fails with "Failed to load custom Reporter from github".
        #
        # The output is also teed to a file and summarised on the run page, because
        # a failure that is not a test failure — an unhandled rejection after the
        # last test, a crash in teardown — produces no annotations at all and
        # would otherwise be completely opaque.
        # Redirected to a file rather than piped.
        #
        # A pipeline here was tried and reverted: `set -o pipefail` is a bashism,
        # and combined with the runner's `bash -e` it ended the step at the test
        # command before the summary could be written — so the step failed with no
        # output of its own, which is the exact opacity it was meant to remove.
        # A plain redirect has no such failure mode, and the exit code still
        # propagates because the command is the last one in the step.
        run: npm run test -- --reporter=github-actions > test-output.log 2>&1

      # Always runs, so a red build says what broke on the run page itself.
      # Kept separate from the test step on purpose: anything that can prevent the
      # test step from producing output must not be in the same step.
      #
      # The interesting lines are emitted as ::error:: annotations as well as
      # going into the job summary. Annotations land on the run page *and* are
      # readable through the API without authentication, which is what makes this
      # diagnosable by someone who is not sitting at the browser. A job summary
      # alone is only visible in the UI.
      - name: Summarise the test run
        if: always()
        working-directory: frontend
        run: |
          if [ ! -f test-output.log ]; then
            echo "::error title=Vitest::no log file was produced at all"
            exit 0
          fi

          # Size and the first lines, unconditionally. Narrow greps hide the
          # failure they were meant to expose: a command that dies before Vitest
          # prints anything contains none of the words being grepped for, so the
          # report is empty and the real cause stays invisible.
          bytes=$(wc -c < test-output.log)
          echo "::error title=Vitest::test-output.log is $bytes bytes"
          head -30 test-output.log | cut -c1-500 | while IFS= read -r line; do
            echo "::error title=Vitest::${line}"
          done

      - name: Coverage
        working-directory: frontend
        # Fails the job if coverage of services/utils/store/hooks drops below the
        # thresholds set in vite.config.js, so the gate cannot be quietly removed.
        run: npm run coverage

      - name: Production build
        working-directory: frontend
        env:
          # A stand-in URL, because this job checks that the bundle compiles and
          # never runs it. The real value is a deploy secret; see deploy.yml.
          VITE_API_URL: https://api.ci.invalid
        run: npm run build

      - name: Staging build
        working-directory: frontend
        env:
          # A separate mode, so the staging build path is exercised on every push
          # rather than first discovered when someone needs it.
          VITE_API_URL: https://api.staging.ci.invalid
        run: npm run build:staging

      - name: Reject a publish build with a placeholder API URL
        working-directory: frontend
        env:
          # No VITE_API_URL, so it falls back to the placeholder in .env.production.
          VITE_DEPLOY: "1"
        run: |
          # Inverted on purpose. This step is only useful if the build FAILS, so
          # it asserts failure rather than asserting success. A guard that is
          # never tested is a guard that quietly stops guarding — which is exactly
          # how the original version of this check ended up in the browser bundle,
          # where nothing could ever trip it.
          if npm run build; then
            echo "::error::A publish build with a placeholder API URL succeeded. The config guard is not working."
            exit 1
          fi
          echo "Guard held: the build was refused."

      - name: Upload the built app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # The full stack, in a real database, with a real browser. Separate from the
  # job above so a Playwright flake does not read as a broken unit test.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway secret. The suite creates its own accounts, and nothing here
      # is reachable once the job ends.
      JWT_SECRET: ci-e2e-secret-not-used-anywhere-real
      # Playwright's webServer block overrides PORT and CORS_ORIGIN for the API it
      # starts, and the API applies the schema on boot, so there is nothing else
      # to configure. This database is the one it will be pointed at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_e2e
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        # Only Chromium. The suite is written against it, and pulling three
        # engines for one project roughly triples the cache for no extra signal.
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          # CI has no preinstalled Chrome, so use the pinned Playwright build.
          E2E_BROWSER: chromium
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
