name: Deploy

# Staging deploys on a merge to main. Production is deliberately NOT automated.
#
# The reasoning, since "why not just automate prod too" is a fair question:
#
#   - Staging is where a bad build is supposed to be discovered. Deploying it
#     automatically on every merge is what makes it worth having.
#   - Production is where a bad build is discovered by customers. That should
#     require a deliberate act by a person, so it is triggered by a
#     workflow_dispatch below rather than by a push.
#
# The two share the same build steps on purpose: if staging and production were
# built differently, staging would stop being evidence about production.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

# A deploy must never run against a half-finished push. Cancelling the older run
# in favour of the newer one means staging always shows the latest merge.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches ci.yml. Must be a Node that every dependency declares support for —
  # jsdom 30 alone rules out Node 20. See ci.yml for the full story.
  NODE_VERSION: "22.22"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GitHub Container Registry. Scoped to this one job
      # rather than the whole workflow, so nothing else can publish.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: docker/setup-buildx-action@v3

      # Logged in with the workflow's own token, not a personal one. That is what
      # makes this work for a repo you cannot grant a PAT to, and it means access
      # ends with the job.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a push to main it is always staging. The dispatch input is only read
      # for a manual run, so a push cannot be talked into deploying to production.
      - name: Resolve the target environment
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.environment }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      # The API image. No build args: everything it needs comes from the
      # environment at run time, which is the correct shape for secrets.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-api:${{ steps.target.outputs.name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app image. The build args are the whole point of this step: VITE_
      # values are inlined at build time, so the API URL is fixed now and cannot
      # be changed by anything the server says later.
      #
      # Requires the APP_API_URL_STAGING repository variable. Skipped with an
      # explicit warning when missing, not failed: this workflow should still push
      # the API image — which needs no configuration at all — so someone setting
      # the repo up for the first time gets a working artifact and a clear
      # instruction, rather than a red X and nothing.
      #
      # Set the variable under Settings > Secrets and variables > Actions >
      # Variables. STAGING_API_HEALTH_URL is used by verify-deploy below.
      - name: Check for the staging API URL
        id: app_config
        env:
          API_URL: ${{ vars.APP_API_URL_STAGING }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APP_API_URL_STAGING is not set, so the app image was not built."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app image
        if: steps.app_config.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-app:${{ steps.target.outputs.name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-app:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.APP_API_URL_STAGING }}
            VITE_APP_ENV=${{ steps.target.outputs.name }}
            VITE_APP_VERSION=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.SENTRY_DSN_STAGING }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          TARGET: ${{ steps.target.outputs.name }}
          SHA: ${{ github.sha }}
          APP_CONFIGURED: ${{ steps.app_config.outputs.configured }}
          API_URL: ${{ vars.APP_API_URL_STAGING }}
        run: |
          {
            echo "### Built for $TARGET"
            echo ""
            echo "| Image | Tag |"
            echo "| --- | --- |"
            echo "| crm-api | \`$SHA\` |"
            if [ "$APP_CONFIGURED" = "true" ]; then
              echo "| crm-app | \`$SHA\` |"
              echo ""
              echo "API URL baked into the app: \`$API_URL\`"
            else
              echo "| crm-app | not built: APP_API_URL_STAGING is not set |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The actual rollout. Skipped rather than failed when the platform credentials
  # are absent, because someone setting up the repo for the first time should get
  # a built-and-pushed image and a clear instruction, not a red X and no artifact.
  deploy:
    name: Roll out
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # Decided inside the job rather than in a job-level `if`.
      #
      # A job-level `if` referencing `secrets` is evaluated by GitHub before the
      # runner exists, and a skipped job leaves no trace — so "no deploy
      # configured" and "the deploy silently did nothing" look identical. Running
      # the check here means it is logged.
      - name: Check for a deploy target
        id: target
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_API_KEY is not set, so nothing was deployed. Images were pushed to the registry."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Render's API. Fails loudly if the service ids are unset rather than
      # deploying nothing successfully.
      - name: Deploy the API
        if: steps.target.outputs.configured == 'true'
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-api:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"$IMAGE\"}"
          echo "API deploy requested."

      - name: Deploy the app
        if: steps.target.outputs.configured == 'true'
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_APP_SERVICE_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/crm-app:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"$IMAGE\"}"
          echo "App deploy requested."

  verify-deploy:
    name: Check the deployment is answering
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      # A deploy that returns 200 once is not a deploy that works. Polling with a
      # timeout catches the two common real failures: a crash loop (never becomes
      # healthy) and a migration failure on boot (healthy, but every request
      # fails).
      - name: Poll the API health endpoint
        env:
          HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HEALTH_URL" ]; then
            echo "STAGING_API_HEALTH_URL is not set; skipping."
            exit 0
          fi
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "$HEALTH_URL" > /dev/null; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "  attempt $i: not healthy yet"
            sleep 10
          done
          echo "::error::The API never became healthy at $HEALTH_URL"
          exit 1
